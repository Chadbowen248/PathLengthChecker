name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0). Creates tag v{version} if missing when publishing.'
        required: true
        default: '2.0.0'
      create_release:
        description: 'Create/update a GitHub Release with zip assets'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build win-x64 (self-contained)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test src/PathLengthChecker.Tests/PathLengthChecker.Tests.csproj -c Release --verbosity minimal

      - name: Publish GUI (self-contained single-file)
        run: |
          dotnet publish src/PathLengthCheckerGUI/PathLengthCheckerGUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/gui-win-x64

      - name: Publish CLI (self-contained single-file)
        run: |
          dotnet publish src/PathLengthChecker/PathLengthChecker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/cli-win-x64

      - name: Zip packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path artifacts/gui-win-x64/* -DestinationPath artifacts/PathLengthCheckerGUI-win-x64.zip -Force
          Compress-Archive -Path artifacts/cli-win-x64/* -DestinationPath artifacts/PathLengthChecker-CLI-win-x64.zip -Force
          $bundle = "artifacts/_bundle"
          if (Test-Path $bundle) { Remove-Item -Recurse -Force $bundle }
          New-Item -ItemType Directory -Force -Path "$bundle/GUI","$bundle/CLI" | Out-Null
          Copy-Item artifacts/gui-win-x64/* "$bundle/GUI" -Recurse
          Copy-Item artifacts/cli-win-x64/* "$bundle/CLI" -Recurse
          Compress-Archive -Path "$bundle/*" -DestinationPath artifacts/PathLengthChecker-win-x64.zip -Force
          Remove-Item -Recurse -Force $bundle
          Get-ChildItem artifacts -Filter *.zip | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PathLengthChecker-win-x64
          path: |
            artifacts/PathLengthCheckerGUI-win-x64.zip
            artifacts/PathLengthChecker-CLI-win-x64.zip
            artifacts/PathLengthChecker-win-x64.zip

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Path Length Checker ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Portable Windows builds (self-contained — no .NET install required on the target PC).

            ### Download
            - **PathLengthCheckerGUI-win-x64.zip** — GUI (double-click `PathLengthCheckerGUI.exe`)
            - **PathLengthChecker-CLI-win-x64.zip** — command line
            - **PathLengthChecker-win-x64.zip** — both (GUI + CLI folders)

            ### OneDrive migration tip
            Set **Replace the Starting Directory** to the future OneDrive path, use the **OneDrive preset (400)**, then enable **Strip prefix when copying/exporting** before giving the list to a client.
          files: |
            artifacts/PathLengthCheckerGUI-win-x64.zip
            artifacts/PathLengthChecker-CLI-win-x64.zip
            artifacts/PathLengthChecker-win-x64.zip
